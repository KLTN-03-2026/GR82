<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu - DTU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Copy toàn bộ CSS từ file reset-password.html của bạn dán vào đây cho nhanh */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; color: #334155; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-container { width: 100%; max-width: 450px; padding: 20px; }
        .auth-card { background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .icon-wrapper { width: 56px; height: 56px; background: #fef2f2; color: #b91c1c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 16px; }
        .auth-header h2 { color: #0f172a; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        .auth-header p { color: #64748b; font-size: 14px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; color: #0f172a; }
        .form-control:focus { border-color: #b91c1c; box-shadow: 0 0 0 3px rgba(185,28,28,0.1); }
        .btn-primary { width: 100%; background: #b91c1c; color: white; padding: 14px; border-radius: 8px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-primary:hover { background: #991b1b; transform: translateY(-1px); }
        .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 10px; }
        .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; }
        .auth-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <div class="icon-wrapper"><i class="fa-solid fa-key"></i></div>
            <h2>Tìm lại mật khẩu</h2>
            <p>Nhập email của bạn để nhận mã xác thực (OTP).</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation" style="margin-top: 2px;"></i>
            <span th:text="${param.error}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="POST">
            <div class="form-group">
                <label class="form-label">Email đã đăng ký <span style="color: #b91c1c;">*</span></label>
                <input type="email" name="email" class="form-control" placeholder="VD: nguyenvan@dtu.edu.vn" required>
            </div>

            <button type="submit" class="btn-primary" onclick="if(this.form.checkValidity()){ this.innerHTML='<i class=\'fa-solid fa-spinner fa-spin\'></i> Đang gửi...'; this.style.pointerEvents='none'; }">
                <i class="fa-solid fa-paper-plane" style="margin-right: 6px;"></i> Gửi mã xác thực
            </button>
        </form>

        <div class="auth-footer">
            <a th:href="@{/login}"><i class="fa-solid fa-arrow-left"></i> Quay lại Đăng nhập</a>
        </div>

    </div>
</div>
</body>
</html>
