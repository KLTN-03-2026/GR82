<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - DTU</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon-wrapper {
            width: 56px;
            height: 56px;
            background: #fef2f2;
            color: #b91c1c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 16px;
        }

        .auth-header h2 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            color: #0f172a;
            background: #ffffff;
        }

        .form-control:focus {
            border-color: #b91c1c;
            box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.1);
        }

        .form-control.readonly {
            background: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        .form-control.otp-input {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #b91c1c;
        }

        .form-control.otp-input::placeholder {
            letter-spacing: 0;
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
        }

        .btn-primary {
            width: 100%;
            background: #b91c1c;
            color: white;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #991b1b;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(185, 28, 28, 0.2);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #ecfdf5;
            color: #166534;
            border: 1px solid #a7f3d0;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <div class="icon-wrapper">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Khôi phục mật khẩu</h2>
            <p>Vui lòng kiểm tra email để lấy mã xác thực (OTP) và tiến hành đặt lại mật khẩu mới.</p>
        </div>

        <!-- Khối hiển thị thông báo lỗi (màu đỏ) -->
        <div th:if="${param.error}" class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation" style="margin-top: 2px;"></i>
            <span th:text="${param.error}"></span>
        </div>

        <!-- Khối hiển thị thông báo thành công (màu xanh lá) -->
        <div th:if="${param.success}" class="alert alert-success">
            <i class="fa-solid fa-circle-check" style="margin-top: 2px;"></i>
            <span th:text="${param.success}"></span>
        </div>

        <form th:action="@{/reset-password}" method="POST">

            <!-- Email (Khóa chỉ đọc, truyền từ URL/Model xuống để user biết họ đang đổi MK cho mail nào) -->
            <div class="form-group">
                <label class="form-label">Tài khoản Email</label>
                <input type="email" name="email" class="form-control readonly" th:value="${email}" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">Mã xác thực (OTP) <span style="color: #b91c1c;">*</span></label>
                <input type="text" name="otp" class="form-control otp-input" placeholder="Nhập 6 số" required maxlength="6" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu mới <span style="color: #b91c1c;">*</span></label>
                <input type="password" name="newPassword" class="form-control" placeholder="Nhập mật khẩu mới" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label">Xác nhận mật khẩu mới <span style="color: #b91c1c;">*</span></label>
                <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" required minlength="6">
            </div>

            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-check" style="margin-right: 6px;"></i> Xác nhận đổi mật khẩu
            </button>
        </form>

        <div class="auth-footer">
            <a th:href="@{/login}"><i class="fa-solid fa-arrow-left" style="margin-right: 4px;"></i> Quay lại trang Đăng nhập</a>
        </div>

    </div>
</div>

</body>

</html>
